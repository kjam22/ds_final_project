name: PHP lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint PHP files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path app -Filter *.php -Recurse -File
          foreach ($file in $files) {
            php -l $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
